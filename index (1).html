:root[data-theme="dark"]{--board:#1f3d31;--frame:#8a5a2b;--ink:#f1f0e6;--muted:#a9c1b3;--line:rgba(241,240,230,.18);--ans:#ffd166;--red:#ff9aa8;--slot:rgba(241,240,230,.08);--btn:#f1f0e6;--btnink:#1f3d31}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--frame);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;padding:clamp(6px,1.4vh,16px)}
.board{flex:1;background:var(--board);border-radius:10px;display:flex;flex-direction:column;padding:clamp(10px,2vh,26px) clamp(12px,2.4vw,40px);min-width:0;box-shadow:inset 0 0 40px rgba(0,0,0,.12)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:"Jua",sans-serif;font-weight:400;margin:0;font-size:clamp(18px,3vh,34px)}
.stage{color:var(--muted);font-size:clamp(13px,2vh,22px);margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:8px;border:2px solid var(--btn);background:transparent;color:var(--ink);padding:6px 12px;font-size:clamp(13px,1.8vh,20px)}
button.primary{background:var(--btn);color:var(--btnink)}
button:disabled{opacity:.35;cursor:default}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,1fr);column-gap:clamp(12px,3vw,60px);margin:clamp(6px,1.5vh,18px) 0;min-height:0}
.q{display:flex;align-items:center;border-bottom:2px dashed var(--line);font-size:clamp(18px,3.6vh,46px);cursor:pointer;min-width:0;user-select:none}
.no{font-family:"Jua",sans-serif;width:2.3em;font-size:.72em;color:var(--muted);flex:none}
.ex{display:inline-flex;align-items:center;min-width:6.2em}
.mx{display:inline-flex;align-items:center;gap:.08em}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.02;font-size:.78em}
.fr .n{border-bottom:.1em solid currentColor;padding:0 .15em}
.fr .d{padding:0 .15em}
.op{margin:0 .3em}
.slot{margin-left:.2em;min-width:3.4em;min-height:1.9em;border-radius:.3em;background:var(--slot);display:inline-flex;align-items:center;justify-content:center;padding:0 .3em;font-family:"Jua",sans-serif;color:var(--muted)}
.slot.open{background:transparent;color:var(--ans);font-family:inherit;font-weight:700}
.slot.fresh{animation:pop .25s ease-out}
.slot .red{color:var(--red);font-size:.62em;display:inline-flex;align-items:center;margin-left:.3em}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
footer{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{min-width:clamp(40px,5.2vw,70px);padding:4px 6px;font-size:clamp(11px,1.5vh,16px);border-width:1.5px}
.dot.cur{background:var(--btn);color:var(--btnink)}
.hint{color:var(--muted);font-size:clamp(11px,1.5vh,16px)}
@media (max-width:700px){.grid{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}.q{min-height:64px;font-size:22px}}
</style></head>

const OP={'+':'+','-':'−'};
const fr=t=>{let h='';if(t.w||!t.d)h+=`<span>${t.w}</span>`;if(t.d)h+=`<span class="fr"><span class="n">${t.n}</span><span class="d">${t.d}</span></span>`;return `<span class="mx">${h}</span>`};
let page=0;const open=new Set();let fresh=new Set();
const grid=document.getElementById('grid'),dots=document.getElementById('dots');
for(let i=0;i<10;i++){const b=document.createElement('button');b.className='dot';b.textContent=`${i*10+1}~${i*10+10}`;b.onclick=()=>go(i);dots.appendChild(b)}
function ans(p){return fr(p.ans)+(p.red?`<span class="red">(=&nbsp;${fr(p.red)})</span>`:'')}
function render(){
  const ps=P.slice(page*10,page*10+10);
  document.getElementById('stage').textContent=`${ps[0].no}~${ps[9].no}번 · ${[...new Set(ps.map(p=>p.typeName))].join(' / ')}`;
  grid.innerHTML=ps.map(p=>`<div class="q" data-no="${p.no}"><span class="no">${p.no}.</span><span class="ex">${fr(p.a)}<span class="op">${OP[p.op]}</span>${fr(p.b)}</span><span class="op">=</span><span class="slot ${open.has(p.no)?'open':''} ${fresh.has(p.no)?'fresh':''}">${open.has(p.no)?ans(p):'?'}</span></div>`).join('');
  grid.querySelectorAll('.q').forEach(el=>el.onclick=()=>toggle(+el.dataset.no));
  fresh=new Set();dots.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('cur',i===page));
  document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===9;
}
function toggle(no){if(open.has(no))open.delete(no);else{open.add(no);fresh.add(no)}render()}
function go(i){page=Math.max(0,Math.min(9,i));render()}
function cur(){return P.slice(page*10,page*10+10)}
document.getElementById('all').onclick=()=>{cur().forEach(p=>{if(!open.has(p.no)){open.add(p.no);fresh.add(p.no)}});render()};
document.getElementById('hide').onclick=()=>{cur().forEach(p=>open.delete(p.no));render()};
document.getElementById('prev').onclick=()=>go(page-1);
document.getElementById('next').onclick=()=>go(page+1);
document.getElementById('fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.getElementById('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
document.documentElement.dataset.theme='dark';
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown')go(page+1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(page-1);
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();const n=cur().find(p=>!open.has(p.no));if(n){open.add(n.no);fresh.add(n.no);render()}else go(page+1)}
  else if(e.key==='a'||e.key==='A')document.getElementById('all').click();
});
render();
